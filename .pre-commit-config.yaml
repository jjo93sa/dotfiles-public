repos:
  - repo: local
    hooks:
      - id: staged-whitespace
        name: Check staged whitespace
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
      - id: nix-format-check
        name: Check Nix formatting
        entry: just format-check
        language: system
        pass_filenames: false
        always_run: true
